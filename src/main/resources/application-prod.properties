# read the ALB forwarded headers to know the original request used HTTPS
server.forward-headers-strategy=native

# Only send the session cookie over HTTPS
server.servlet.session.cookie.secure=true

# Stop JavaScript from reading the session cookie
server.servlet.session.cookie.http-only=true

# Do not send the session cookie for cross-site actions, but allow normal links to Ravyn
server.servlet.session.cookie.same-site=lax

# Use the session cookie for every Ravyn endpoint
server.servlet.session.cookie.path=/

# Log the user out after 30 minutes of inactivity
server.servlet.session.timeout=30m
